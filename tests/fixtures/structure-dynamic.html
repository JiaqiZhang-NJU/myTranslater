<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Atlas Project</title>
  <link rel="stylesheet" href="/content.css">
</head>
<body>
  <nav aria-label="Site"><ul><li><a href="#about">About</a></li><li><a href="#projects">Projects</a></li></ul></nav>
  <main>
    <h1 id="about">About</h1>
    <p>Atlas is a tool for developers.</p>
    <p id="inline">Read the <a href="#projects"><strong>project guide</strong></a> today.</p>
    <ul><li>Install Atlas</li><li>Open your project<ul><li>Run Atlas</li></ul></li></ul>
    <button id="action" type="button">Apply</button>
    <table id="projects"><caption>Projects</caption><thead><tr><th>Name</th><th>Status</th><th>Count</th></tr></thead>
      <tbody><tr><th scope="row">Atlas</th><td id="state">Open</td><td>42</td></tr></tbody>
    </table>
    <div id="updates"></div>
  </main>
  <script>
    window.requests = [];
    window.chrome = { runtime: {
      id: 'smoke-extension',
      onMessage: { addListener: callback => { window.toggleFromToolbar = () => callback({ type: 'TOGGLE_TRANSLATION' }, { id: 'smoke-extension' }, () => {}); } },
      sendMessage: async message => {
        if (message.type === 'GET_PROVIDER_STATUS') return { ok: true, ready: true, identity: 'ollama:mock:v1', settingsVersion: 1 };
        if (message.type === 'TRANSLATE') {
          window.requests.push(message.batch);
          document.documentElement.dataset.requestCount = String(window.requests.length);
          const openCell = message.batch.groups.flatMap(group => group.blocks).find(block => block.role === 'cell' && block.text === 'Open');
          if (openCell) document.documentElement.dataset.openContext = openCell.context || '';
          if (location.search === '?race' && message.batch.groups.some(group => group.blocks.some(block => block.text === 'Slow old text.'))) {
            await new Promise(resolve => setTimeout(resolve, 1400));
          }
          return { ok: true, usage: { totalTokens: 10 }, translations: message.batch.groups.flatMap(group => group.blocks.map(block => ({ id: block.id, text: `译文：${block.text}` }))) };
        }
        return { ok: true };
      }
    } };
    document.querySelector('#action').addEventListener('click', () => document.documentElement.dataset.buttonClicked = 'true');
  </script>
  <script src="/content.js"></script>
  <script>
    setTimeout(() => window.toggleFromToolbar(), 50);
    if (location.search === '?dynamic') {
      setTimeout(() => {
        const paragraph = document.createElement('p');
        paragraph.id = 'dynamic';
        paragraph.textContent = 'New release available.';
        document.querySelector('#updates').append(paragraph);
      }, 250);
      setTimeout(() => { document.querySelector('#dynamic').textContent = 'Updated release available.'; }, 1600);
    }
    if (location.search === '?race') {
      const paragraph = document.createElement('p');
      paragraph.id = 'raced';
      paragraph.textContent = 'Slow old text.';
      document.querySelector('#updates').append(paragraph);
      setTimeout(() => { paragraph.textContent = 'Current new text.'; }, 250);
    }
  </script>
</body>
</html>
